app:
  features:
    auth:
      # Auth is still a work in progress, so it's only on locally for now.
      enabled: true

  jwt:
    # No JWT_PRIVATE_KEY locally? Then a temporary key is generated at startup (with a warning).
    # Tokens from before a restart stop working; the frontend just refreshes.
    generate-key-if-missing: true

  refresh-token:
    # Local backend runs on plain http, so a Secure cookie would never be stored.
    cookie-secure: false

  admin:
    # Fixed token for local development only. Prod reads ADMIN_TOKEN from the environment.
    token: ${ADMIN_TOKEN:dev-admin-token}

logging:
  level:
    com.coursefinder: DEBUG
