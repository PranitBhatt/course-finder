# Shared settings. Profile files override parts of this:
#   application-dev.yml  - local development (IntelliJ: Active profiles = dev)
#   application-prod.yml - Render + Neon (SPRING_PROFILES_ACTIVE=prod)
# Every secret comes from an environment variable; nothing secret is written here.

spring:
  application:
    name: course-finder

  # Local database (docker-compose or a local PostgreSQL). In prod, DATABASE_URL is used instead.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:coursefinder}
    username: ${POSTGRES_USER:coursefinder}
    password: ${POSTGRES_PASSWORD:coursefinder}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Migrations in db/migration run automatically on every startup.
  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  # Render (and most hosts) tell the app which port to use via PORT.
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  features:
    auth:
      # Off by default so prod (Render) never exposes unfinished auth endpoints.
      # When false, /api/auth/** does not exist at all (404). Turned on in application-dev.yml.
      enabled: false

  cors:
    # Comma-separated list, e.g. https://mydomain.me,https://myapp.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  search:
    # Typo tolerance: min trigram word similarity (0-1). Lower = more forgiving, more noise.
    fuzzy-threshold: 0.4

  jwt:
    # RSA private key for signing access tokens (RS256): a PKCS#8 PEM, base64-encoded into one line.
    # No default on purpose: with auth enabled and no key, startup fails. See .env.example.
    private-key: ${JWT_PRIVATE_KEY:}
    # Written into every token header as "kid", so keys can be swapped later without breaking old tokens.
    key-id: ${JWT_KEY_ID:}
    # Checked on every incoming token: a token from another issuer, or meant for another audience, is refused.
    issuer: ${JWT_ISSUER:course-finder-api}
    audience: ${JWT_AUDIENCE:course-finder-web}
    # Only application-dev.yml turns this on.
    generate-key-if-missing: false
    # Short on purpose: an access token can't be revoked, so a stolen one should stop working soon.
    access-token-expiration: 15m

  refresh-token:
    # Stored in the database, so it can be revoked (logout). Used to get new access tokens.
    expiration: 7d
    # Daily cleanup of expired tokens (RefreshTokenCleanupJob).
    cleanup-cron: "0 30 4 * * *"
    # The refresh token cookie is HTTPS-only. Turned off in application-dev.yml for http://localhost.
    cookie-secure: true
    # A used token coming back within this time is treated as two tabs refreshing at once (401, session
    # kept), not as theft (session revoked). Longer = fewer false alarms, but a bigger blind spot.
    reuse-grace-period: 10s

  session:
    # A login lasts at most this long, however often it is refreshed. Then the user logs in again.
    absolute-lifetime: 30d

  admin:
    # Required in the X-Admin-Token header for /api/admin/**. Empty = admin endpoints always 401.
    token: ${ADMIN_TOKEN:}

  stats:
    # Day boundaries for "searches per day" in GET /api/admin/stats.
    time-zone: Asia/Kolkata

  rate-limit:
    # Per client IP, on /api/courses/search. Protects the YouTube API quota.
    search-requests-per-minute: 60

  coursera:
    enabled: true
    base-url: https://api.coursera.org
    page-size: 100
    # Safety cap so a misbehaving endpoint can't loop forever.
    max-pages: 2000
    # Per-page retries on network errors / 5xx (4xx are not retried).
    max-retries: 2
    retry-backoff: 1s
    # In-app nightly sync. Turned off in prod, where GitHub Actions triggers the sync instead.
    scheduled-sync: true
    sync-cron: "0 0 3 * * *"
    sync-on-startup-if-empty: true
    connect-timeout: 5s
    read-timeout: 30s

  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    base-url: https://www.googleapis.com/youtube/v3
    max-results: 25
    cache-ttl: 7d
    # Free tier is 10,000 units/day; search.list = 100 units, playlists.list = 1 unit.
    daily-quota-units: 9000
    connect-timeout: 3s
    read-timeout: 5s

logging:
  level:
    com.coursefinder: INFO
